<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Unspent Library</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Ubuntu&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-color: #f0f4f8;
    --text-color: #222;
    --shadow-color: rgba(0,0,0,0.1);
    --hover-shadow-color: rgba(0,0,0,0.2);
    --filter-tag-bg: #fff;
    --filter-tag-hover: #e0f7fa;
    --figure-bg: #ffffff;
    --figure-shadow: rgba(0,0,0,0.1);
    --caption-color: #555;
    --blue-color: #4a90e2;
    --primary-color: #4a90e2;
    --secondary-color: #7ed6df;
  }
  body.dark-mode {
    --bg-color: #222;
    --text-color: #eee;
    --shadow-color: rgba(0,0,0,0.6);
    --hover-shadow-color: rgba(0,0,0,0.8);
    --filter-tag-bg: #333;
    --filter-tag-hover: #555;
    --figure-bg: #222;
    --figure-shadow: rgba(0,0,0,0.7);
    --caption-color: #aaa;
    --blue-color: #2980b9;
    --primary-color: #2980b9;
    --secondary-color: #3498db;
  }
  *:focus { outline: none; box-shadow: none; }
  * {
    box-sizing: border-box; margin: 0; padding: 0; cursor: default;
  }
  body {
    font-family: 'Ubuntu', Arial, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    display: flex; min-height: 100vh;
  }
  /* Sidebar styles */
  #sidebar {
    position: fixed; top: 0; left: 0; height: 100%;
    background: var(--figure-bg);
    box-shadow: 2px 0 8px var(--shadow-color);
    padding: 20px 15px;
    display: flex; flex-direction: column; align-items: center;
    width: 160px; overflow-y: auto; z-index: 1000;
    transition: background 0.3s;
    min-height: 100vh;
  }
  #sidebar::-webkit-scrollbar {
    width: 6px;
  }
  #sidebar::-webkit-scrollbar-thumb {
    background: rgba(0,0,0,0.2);
    border-radius: 3px;
  }
  #mode-toggle {
    position: fixed; top: 15px; right: 15px; font-size: 1.5em;
    background: transparent; border: none; cursor: pointer; z-index: 1100;
    transition: transform 0.2s;
  }
  #mode-toggle:hover {
    transform: scale(1.2);
  }
  #sidebar input[type="search"] {
    margin-top: 15px; width: 100%; padding: 10px 15px; border-radius: 20px;
    border: 1px solid #ccc; font-family: 'Ubuntu'; font-size: 14px; transition: box-shadow 0.3s, border-color 0.3s;
  }
  #sidebar input[type="search"]:focus {
    box-shadow: 0 0 8px #2980b9;
    border-color: #2980b9;
  }
  /* Removed sidebar title as per request */
  #categoriesContainer {
    display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 20px;
  }
  /* Buttons */
  .category-btn {
    padding: 10px; width: 100%; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    color: #fff; font-family: 'Ubuntu'; font-weight: bold; font-size: 0.9em;
    cursor: pointer; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); transition: all 0.3s;
  }
  .category-btn:hover {
    background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    transform: translateY(-2px);
  }
  /* Main content styles */
#content {
    margin-left: 160px; padding: 30px 20px; flex: 1;
    transition: margin-left 0.3s;
  }
@media (max-width: 768px) {
  #sidebar {
    width: 140px;
    padding: 15px 10px;
  }
  #content {
    margin-left: 140px;
  }
}
  #main-title {
    font-family: 'Pacifico', cursive; font-size: 2.5em; margin-bottom: 20px; color: var(--blue-color);
    text-align: center;
  }
  #figures {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px;
  }
  figure {
    background: var(--figure-bg); border-radius: 12px; box-shadow: 0 4px 8px var(--figure-shadow);
    padding: 15px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: all 0.3s;
    position: relative;
  }
  figure:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 20px rgba(0,0,0,0.2);
  }
  figure a { display: flex; flex-direction: column; align-items: center; }
  figure img {
    width: 80px; height: 80px; object-fit: contain; border-radius: 8px; margin-bottom: 10px; transition: transform 0.3s;
  }
  figure img:hover {
    transform: scale(1.05);
  }
  figcaption {
    font-family: 'Pacifico', cursive; font-size: 1.1em; margin-top: 8px; color: var(--caption-color);
    text-align: center;
  }
  /* The description stats as toggleable panel */
  .stats {
    margin-top: 6px; font-size: 0.85em; font-style: italic; color: var(--caption-color);
    display: none;
    cursor: pointer; /* Indicate toggleability */
  }
  .show-stats .stats {
    display: block;
  }
  /* Info icon, now removed info icons from figures */
  /* .info-icon { ... } */ /* Removed as per request */
  /* Back to top button */
  #backToTop {
    position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px;
    background: var(--primary-color); color: #fff; border: none; border-radius: 50%; font-size: 1.5em;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px var(--shadow-color);
    cursor: pointer; transition: all 0.3s;
  }
  #backToTop.hidden {
    opacity: 0; pointer-events: none;
  }
  #backToTop:hover {
    background: #2980b9; transform: scale(1.1);
  }
  /* Additional styles for message links if needed */
.message-container a {
    color: var(--blue-color); text-decoration: underline;
}
</style>
</head>

<script data-goatcounter="https://unspentlibrary.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<body>

<!-- Dark Mode Toggle -->
<button id="mode-toggle" title="Toggle Light/Dark">🌙</button>

<!-- Sidebar -->
<div id="sidebar">
  <!-- Removed title as per request -->
  <input type="search" id="sidebar-search" placeholder="Search..." />
  <div id="categoriesContainer">
    <button class="category-btn" data-filter="All"><span>All</span></button>
    <button class="category-btn" data-filter="Water and Hygiene"><span>Water & Hygiene</span></button>
    <button class="category-btn" data-filter="Hunger"><span>Hunger</span></button>
    <button class="category-btn" data-filter="Homelessness"><span>Homelessness</span></button>
    <button class="category-btn" data-filter="Environment"><span>Environment</span></button>
    <button class="category-btn" data-filter="Animals"><span>Animals</span></button>
  </div>
</div>

<!-- Main Content -->
<div id="content">
  <h1 id="main-title">Unspent Library</h1>
  <div id="figures"></div>
</div>

<!-- Back to Top Button -->
<div id="backToTop">↑</div>

<script>
const figures = [
    {
      href: "https://unspent.cash/s?q=eJxbKeLPXbigc2Whxc%2FyGRoWr%2BfmlEsxNLcDAHgMCfs%3D",
      src: "https://i.postimg.cc/WhhBvVgX/eatbch.png",
      caption: "eatBCH",
      categoryLabel: "Hunger",
      stats: "Volunteers deliver hot meals for their communities - eatbch.org"
    },
    {
      href: "https://unspent.cash/s?q=eJwrWymSLzSVO30Nv5%2Fkk3XaCw9OqzV5%2F2J5xxoAhj0L9g%3D%3D",
      src: "https://i.postimg.cc/8Ft68f9T/koala.png",
      caption: "Currumbin Wildlife Hospital",
      categoryLabel: "Animals",
      stats: "Supports wildlife rehabilitation and rescue - currumbinwildlifehospital.org"
    },
    {
      href: "https://unspent.cash/s?q=eJwrWyly6%2FGBQ1J7kj4zcBz4NT1vk0%2FSztpbHWsAtGYOCQ%3D%3D",
      src: "https://i.postimg.cc/jnzqbG26/elephants.png",
      caption: "Global Sanctuary for Elephants",
      categoryLabel: "Animals",
      stats: "Protecting elephants in their natural habitat - globalelephants.org"
    },
    {
      href: "https://unspent.cash/s?q=eJwrWylS6OEXxvnDZ%2BWUlatMS%2F%2FlXzeU2jazYw0AkugMKg%3D%3D",
      src: "https://i.postimg.cc/xNKj2W8y/treehousehumane.png",
      caption: "Tree House Humane Society",
      categoryLabel: "Animals",
      stats: "Rescue and shelter for animals - treehouseanimals.org"
    }
];

function shuffleArray(array) {
  for (let i=array.length-1; i>0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function populateFigures() {
  const container = document.getElementById('figures');
  container.innerHTML = '';
  figures.forEach(item => {
    const figure = document.createElement('figure');
    // Store category label for filtering
    figure.setAttribute('data-category', item.categoryLabel);
    // When clicking on figure, toggle description
    figure.onclick = () => {
      figure.classList.toggle('show-stats');
    };

    let figureHTML = `
      <a href="${item.href}" target="_blank" rel="noopener noreferrer">
        <img src="${item.src}">
      </a>
      <div class="fig-details">
        <div class="fig-text">
          <figcaption>${item.caption}</figcaption>
          <div class="stats">${item.stats}</div>
        </div>
      </div>
    `;
    figure.innerHTML = figureHTML;

    container.appendChild(figure);
  });
}

function filterFigures(type, value) {
  document.querySelectorAll('#figures figure').forEach(fig => {
    const category = fig.dataset.category.toLowerCase();
    const captionText = fig.querySelector('figcaption').innerText.toLowerCase();
    const statsText = fig.querySelector('.stats').innerText.toLowerCase();
    if (type === 'category') {
      if (value.toLowerCase() === 'all' || category === value.toLowerCase()) {
        fig.style.display = '';
      } else {
        fig.style.display = 'none';
      }
    } else if (type === 'search') {
      if (
        value === '' ||
        category.includes(value) ||
        captionText.toLowerCase().includes(value) ||
        statsText.toLowerCase().includes(value)
      ) {
        fig.style.display = '';
      } else {
        fig.style.display = 'none';
      }
    }
  });
}

const backBtn = document.getElementById('backToTop');
backBtn.classList.add('hidden');
let hideTimeout = null;

document.addEventListener('DOMContentLoaded', () => {
  const modeToggle = document.getElementById('mode-toggle');
  document.body.classList.add('dark-mode');
  modeToggle.innerHTML = '🌙';
  modeToggle.onclick = () => {
    document.body.classList.toggle('dark-mode');
    modeToggle.innerHTML = document.body.classList.contains('dark-mode') ? '🌙' : '☀️';
  };

  shuffleArray(figures);
  populateFigures();
  filterFigures('category', 'All');

  document.getElementById('sidebar-search').addEventListener('input', e => {
    filterFigures('search', e.target.value.toLowerCase());
  });
  document.getElementById('sidebar-search').addEventListener('focus', () => {
    document.getElementById('sidebar-search').style.boxShadow = '0 0 8px #2980b9';
  });
  document.getElementById('sidebar-search').addEventListener('blur', () => {
    document.getElementById('sidebar-search').style.boxShadow = '';
  });

  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.onclick = () => { filterFigures('category', btn.dataset.filter); };
  });

  window.addEventListener('scroll', () => {
    backBtn.classList.remove('hidden');
    if (hideTimeout) clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      backBtn.classList.add('hidden');
    }, 2000);
  });
  document.getElementById('backToTop').onclick = () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
});
</script>
</body>
</html>
